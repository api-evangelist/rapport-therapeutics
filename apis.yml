aid: rapport-therapeutics
name: Rapport Therapeutics
description: >-
  Rapport Therapeutics, Inc. (Nasdaq: RAPP) is a clinical-stage biotechnology company headquartered in
  Boston, Massachusetts with research operations in San Diego, California, founded in 2022 and taken
  public in a $174 million IPO in June 2024. Rapport develops precision small-molecule medicines for
  central nervous system disorders using its proprietary RAP technology platform, which pairs human
  genetics with functional proteomics to identify receptor-associated proteins that confer
  neuroanatomical specificity — the goal being drugs that act only where the disease circuit lives
  rather than across the whole brain. Its lead clinical candidate, RAP-219, is a selective negative
  allosteric modulator of TARP-gamma-8-associated AMPA receptors in development for focal onset
  seizures, peripheral neuropathic pain and bipolar disorder, behind two discovery-stage nicotinic
  acetylcholine receptor programs targeting alpha-6 (chronic pain) and alpha-9-alpha-10 (hearing
  disorders). Rapport is a therapeutics developer, not a software vendor: the RAP platform is an
  internal discovery capability and the company publishes no developer program, no public API and no
  machine-readable API contract.
